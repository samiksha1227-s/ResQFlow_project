name: resqflow_ai
description: ResQFlow AI - Source-Agnostic Emergency Response & Coordination System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # HTTP
  http: ^1.2.1
  
  # Storage
  shared_preferences: ^2.2.3
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # Icons & UI helpers
  flutter_svg: ^2.0.10+1
  
  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
